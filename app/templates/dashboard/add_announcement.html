{% extends "dashboard/dashboard_base.html" %}

{% block content %}

<h2>Add Announcement</h2>

<form method="POST">

<div class="mb-3">

<label>Title</label>

<input
type="text"
name="title"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Content</label>

<textarea
name="content"
rows="6"
class="form-control"
required></textarea>

</div>

<button class="btn btn-primary">

Publish

</button>

</form>

{% endblock %}
