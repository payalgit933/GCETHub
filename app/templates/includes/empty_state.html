<div class="card empty-state-card">
    <div class="card-body text-center py-5">
        <div class="empty-state-icon mb-3">
            <i class="bi {{ icon|default('bi-inbox') }}"></i>
        </div>
        <h5 class="card-title fw-semibold">{{ heading }}</h5>
        <p class="card-text text-muted mb-4">{{ message|safe }}</p>
        {% if action_url %}
        <a href="{{ action_url }}" class="btn btn-primary">
            {% if action_icon %}
            <i class="bi {{ action_icon }} me-1"></i>
            {% endif %}
            {{ action_text }}
        </a>
        {% endif %}
    </div>
</div>
