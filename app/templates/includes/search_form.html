<form method="GET" class="search-form mb-3">
    <div class="input-group">
        <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-search text-muted"></i>
        </span>
        <input
            type="text"
            name="search"
            class="form-control border-start-0"
            placeholder="{{ placeholder|default('Search...') }}"
            value="{{ search|default('') }}">
        <button type="submit" class="btn btn-primary">
            Search
        </button>
        {% if search %}
        <a href="{{ clear_url }}" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg me-1"></i> Clear
        </a>
        {% endif %}
    </div>
    {% if search %}
    <p class="search-result-count mt-2 mb-0">
        <i class="bi bi-funnel me-1"></i>
        {{ result_count }} matching result{{ 's' if result_count != 1 else '' }}
        for "<strong>{{ search }}</strong>"
    </p>
    {% elif result_count is defined %}
    <p class="search-result-count mt-2 mb-0">
        {{ result_count }} item{{ 's' if result_count != 1 else '' }} found
    </p>
    {% endif %}
</form>
