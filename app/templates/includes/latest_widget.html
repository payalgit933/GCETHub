<div class="col-lg-6">
    <div class="content-card h-100">
        <div class="card-header-custom d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="bi {{ icon }} me-2 text-primary"></i>{{ title }}
            </h5>
            <a href="{{ view_all_url }}" class="btn btn-sm btn-outline-primary">View All</a>
        </div>
        <div class="card-body-custom p-0">
            {% if items %}
            <ul class="list-group list-group-flush latest-widget-list">
                {% for item in items %}
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                    <div class="min-w-0">
                        <div class="fw-semibold text-truncate">{{ item.title }}</div>
                        <small class="text-muted">
                            <i class="bi bi-calendar3 me-1"></i>{{ item.date }}
                        </small>
                    </div>
                    <a href="{{ item.action_url }}" class="btn btn-sm btn-outline-primary flex-shrink-0">
                        {{ item.action_text|default('View') }}
                    </a>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <div class="text-center py-4 text-muted">
                <i class="bi {{ icon }} d-block mb-2 fs-4"></i>
                <small>No items yet</small>
            </div>
            {% endif %}
        </div>
    </div>
</div>
